<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSS Demonstration</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Internal CSS -->
  <style>
    .internal {
      color: #4f46e5;
      margin: 20px;
      padding: 20px;
      border: 2px solid #c7d2fe;
      border-radius: 12px;
      background: #f0f4ff;
    }
    .external {
  background-color: lightyellow;
  font-size: 18px;
  padding: 10px;
  border: 2px dashed orange;
  text-align: center;
}

  </style>
</head>
<body>
  <!-- Inline CSS -->
  <h1 style="color: red; text-align: center;">This is Inline CSS</h1>

  <!-- Internal CSS -->
  <p class="internal">This is Internal CSS</p>

  <!-- External CSS -->
  <p class="external">This is External CSS</p>
</body>
</html>
